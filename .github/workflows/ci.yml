name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'documents/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'documents/**'
      - '**.md'

# Cancel older runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # JOB 0: SUBSYSTEM PATH FILTERING
  # -------------------------------------------------------------
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'MVP/backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'MVP/frontend/**'
              - '.github/workflows/ci.yml'

  # -------------------------------------------------------------
  # JOB 1: SECURITY SCAN
  # -------------------------------------------------------------
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # JOB 2: BACKEND COMPILE, LINT & AST 3-TIER BOUNDARY CHECK
  # -------------------------------------------------------------
  backend-compile-and-lint:
    name: Backend Compile & Architecture
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MVP/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: MVP/backend/requirements.txt

      - name: Fast Python Bytecode Compilation Check (< 2s)
        run: python -m compileall app -q

      - name: Install Linting & Formatting Tools
        run: pip install ruff black

      - name: Run Ruff & Black Check
        run: |
          ruff check .
          black --check .

      - name: Enforce 3-Tier Layering Boundaries (AST Script)
        run: python scripts/check_architecture.py

  # -------------------------------------------------------------
  # JOB 3: BACKEND TESTS & MYSQL 8.0 VERIFICATION
  # -------------------------------------------------------------
  backend-test:
    name: Backend Pytest & DB Schema
    needs: [detect-changes, backend-compile-and-lint]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: smart_museum
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: MVP/backend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: MVP/backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Verify MySQL 8.0 DDL Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword smart_museum < scripts/mysql_schema.sql

      - name: Run Pytest (Coverage >= 80%)
        env:
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/smart_museum
          ENV: test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # -------------------------------------------------------------
  # JOB 4: FRONTEND LINT & DOMAIN STATIC CHECK
  # -------------------------------------------------------------
  frontend-compile-and-lint:
    name: Frontend Lint & Domain Rules
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MVP/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MVP/frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Enforce Presentation & Domain Rules (Static Scan)
        run: node scripts/check_frontend_rules.js

      - name: Run ESLint (Strict)
        run: npm run lint

  # -------------------------------------------------------------
  # JOB 5: FRONTEND TEST & VITE PRODUCTION BUILD
  # -------------------------------------------------------------
  frontend-test-and-build:
    name: Frontend Vitest & Vite Build
    needs: [detect-changes, frontend-compile-and-lint]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MVP/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MVP/frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vitest (CI Run Mode, No Watch)
        run: npx vitest run

      - name: Compile Production Bundle (Vite Build)
        run: npm run build

  # -------------------------------------------------------------
  # JOB 6: QUALITY GATE TỔNG HỢP (Yêu cầu bắt buộc để Merge PR)
  # -------------------------------------------------------------
  ci-gate:
    name: CI Quality Gate
    needs: [detect-changes, security-scan, backend-test, frontend-test-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [[ "${{ needs.security-scan.result }}" == "failure" || \
                "${{ needs.backend-test.result }}" == "failure" || \
                "${{ needs.frontend-test-and-build.result }}" == "failure" ]]; then
            echo "❌ CI Quality Gate Failed: One or more critical jobs failed."
            exit 1
          fi
          echo "✅ All required checks completed successfully."
