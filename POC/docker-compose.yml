services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poc_museum_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/static:/app/static
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=/app/data/data.db
      - STATIC_DIR=/app/static
      - TARGET_LANGUAGES=en,ja,ko,zh
    networks:
      - poc_network

  # Optional Cloudflare tunnel service for public mobile testing over HTTPS
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: poc_cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    networks:
      - poc_network
    profiles:
      - tunnel

networks:
  poc_network:
    driver: bridge
